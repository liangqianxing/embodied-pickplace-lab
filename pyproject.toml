[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-pickplace-lab"
version = "0.1.0"
description = "Contact-based MuJoCo pick-and-place with reproducible imitation learning."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["mujoco>=3.3,<4", "gymnasium>=1.1,<2", "torch>=2.6,<3", "numpy>=2,<3", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
pickplace = "pickplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pickplace = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
